<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="media.css" />
    <title>weather app</title>
  </head>

  <body>
    <header>
      <nav>
        <h1>Live Weather</h1>
      </nav>

      <form class="weather-form">
        <input
          type="text"
          class="city-input"
          placeholder="Enter city"
          spellcheck="false"
        />
        <button class="search-btn" type="submit">Search</button>
      </form>

      <div class="error">
        <p>Invalid city name, please enter a correct city name</p>
      </div>
    </header>

    <main>
      <section class="current">
        <div class="current-weather">
          <div class="current-location">
            <div class="current-city">Yaounde</div>
            <div class="current-temperatures">20&deg;</div>
            <div class=" current-description">clear skies</div>
          </div>

          <div class="current-icon">
            <div class="current-date">Friday, June 19th, 2026</div>
            <img
              src="assets/images/_ (5).jpeg"
              alt=""
              width="320"
              height="320"
            />
          </div>
        </div>

        <div class="current-conditions">
          <div class="current-condition">
            <div class="current-condition-title">Temperature</div>
            <div id="feels-like" class="current-condition-value">20&deg;</div>
          </div>

          <div class="current-condition">
            <div class="current-condition-title">Humidity</div>
            <div id="humidity" class="current-condition-value">40%</div>
          </div>

          <div class="current-condition">
            <div class="current-condition-title">Wind Speed</div>
            <div id="wind-speed" class="current-condition-value">40 km/h</div>
          </div>
        </div>
      </section>

      <section class="daily">
        <h2 class="section-daily-title">5 days weather forecast</h2>
        <div class="daily-forcast">
          <div class="daily-day">
            <p class="day-title">Today</p>
            <img
              src="assets/images/_ (5).jpeg"
              alt=""
              width="200"
              height="200"
            />
            <p class="daily-day-temperature">22&deg;</p>
          </div>

          <div class="daily-day">
            <p class="day-title">Monday</p>
            <img
              src="assets/images/_ (5).jpeg"
              alt=""
              width="200"
              height="200"
            />
            <p class="daily-day-temperature">22&deg;</p>
          </div>

          <div class="daily-day">
            <p class="day-title">Tuesday</p>
            <img
              src="assets/images/_ (5).jpeg"
              alt=""
              width="200"
              height="200"
            />
            <p class="daily-day-temperature">22&deg;</p>
          </div>

          <div class="daily-day">
            <p class="day-title">Wednesday</p>
            <img
              src="assets/images/_ (5).jpeg"
              alt=""
              width="200"
              height="200"
            />
            <p class="daily-day-temperature">22&deg;</p>
          </div>

          <div class="daily-day">
            <p class="day-title">Thursday</p>
            <img
              src="assets/images/_ (5).jpeg"
              alt=""
              width="200"
              height="200"
            />
            <p class="daily-day-temperature">22&deg;</p>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
